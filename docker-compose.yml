services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chatgpt
      POSTGRES_PASSWORD: chatgpt
      POSTGRES_DB: chatgpt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatgpt -d chatgpt"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: postgresql://chatgpt:chatgpt@db:5432/chatgpt
      JWT_SECRET: docker-dev-secret-change-me
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: gpt-4o-mini
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
